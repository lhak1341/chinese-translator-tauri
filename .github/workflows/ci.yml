name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run wasm-core Rust tests
        run: cargo test --manifest-path wasm-core/Cargo.toml

      - name: Run src-tauri Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # cargo test compiles lib, bins and tests, but never benches — a bench referencing a
      # changed signature bit-rots silently until someone runs it by hand.
      - name: Compile benches
        run: |
          cargo check --benches --manifest-path wasm-core/Cargo.toml
          cargo check --benches --manifest-path src-tauri/Cargo.toml

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM modules
        run: pnpm build-wasm-dev

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test -- --run
