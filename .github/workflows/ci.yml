name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # scripts/*.mjs shell out to `node` explicitly, so Node stays installed
      # even though bun is the package manager.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # src-tauri links GTK/WebKit through Tauri, so it will not build on a bare Linux
      # runner — glib-sys fails at pkg-config before any test runs. wasm-core needs none of
      # this (it targets wasm32), but the packages are installed once for the whole job.
      # Canonical list from Tauri v2's Debian/Ubuntu prerequisites, minus what the runner
      # image already ships (build-essential, curl, wget, file).
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run wasm-core Rust tests
        run: cargo test --manifest-path wasm-core/Cargo.toml

      # book_loader/chapter_outline's corpus tests read a real personal novel library
      # (~/Downloads/_FICTION by default) that CI has no access to and can't be given —
      # the fixture is real books on purpose (see book_loader.rs's `corpus_dir()`). The
      # explicit opt-out is what keeps a genuinely missing corpus from failing silently
      # on a dev machine; CI is the one place it's expected to be absent.
      - name: Run src-tauri Rust tests
        env:
          SKIP_READER_CORPUS_TESTS: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # cargo test compiles lib, bins and tests, but never benches — a bench referencing a
      # changed signature bit-rots silently until someone runs it by hand. Only crates with a
      # bench target are checked: on a crate without one, --benches compiles the lib and bins
      # under cfg(test), which cargo test above already did. A bench added later is picked up.
      - name: Compile benches
        run: scripts/check-benches.sh

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM modules
        run: bun run build-wasm-dev

      - name: Type check
        run: bun run type-check

      - name: Type check tests and JavaScript (ratchet)
        run: bun run type-check:ratchet

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Run tests
        run: bun run test --run
