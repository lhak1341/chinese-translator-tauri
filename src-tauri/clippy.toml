# Methods this crate must not call directly. Each reason names what to use instead.
# Cargo does not track this file: after editing it, touch a source file before running clippy,
# or the cached result passes.
disallowed-methods = [
  # A crash mid-write leaves a truncated file. write_atomic writes a temp file and renames it.
  { path = "std::fs::write", reason = "use write_atomic (dictionary_commands.rs)" },
  # Wrapping hash arithmetic can produce i32::MIN, and its abs() overflows in debug builds.
  { path = "i32::abs", reason = "use wrapping_abs" },
]
