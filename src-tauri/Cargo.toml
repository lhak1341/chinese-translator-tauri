[package]
name = "chinese-translator-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chinese_translator_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zip = "2"
rayon = "1.10"
hashbrown = { version = "0.14", features = ["serde"] }  # Fast HashMap implementation with serde support
governor = "0.6"  # Rate limiting for security
once_cell = "1.20"  # CODE REVIEW FIX (CRITICAL-2): Store AppHandle for event emission
chrono = { version = "0.4", features = ["clock"] }  # CODE REVIEW FIX (CRITICAL-2): Timestamp for poisoning events — "clock" feature required for Utc::now() in chrono 0.4.20+

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
aho-corasick = "1.1"  # Bench-only: comparison baseline against lookup_index_engine::TrieNode

[[bench]]
name = "trie_matching"
harness = false

