<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Processing Parity Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .test-case {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .test-case.pass {
      background-color: #d4edda;
      border-color: #c3e6cb;
    }
    .test-case.fail {
      background-color: #f8d7da;
      border-color: #f5c6cb;
    }
    .test-header {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .test-details {
      margin-left: 20px;
      font-size: 14px;
    }
    .diff {
      background-color: #fff3cd;
      padding: 10px;
      margin: 10px 0;
      border-left: 3px solid #ff9800;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    #summary {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
      padding: 15px;
      border-radius: 5px;
    }
    #summary.pass {
      background-color: #d4edda;
      color: #155724;
    }
    #summary.fail {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1>🧪 Pattern Processing Parity Test</h1>
  <p>This page tests whether Rust WASM and JavaScript implementations produce identical results.</p>

  <div>
    <button onclick="runTests()">Run Parity Tests</button>
    <button onclick="toggleWasm()">Toggle WASM (Currently: <span id="wasm-status">Enabled</span>)</button>
  </div>

  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    import { initializeWasmPatternProcessor, isWasmPatternProcessorAvailable } from './src/utils/WasmPatternProcessor.js';

    // Test cases covering critical scenarios
    const TEST_CASES = [
      {
        name: "Simple variable pattern (从X上)",
        input: "从武技上",
        description: "Basic single-variable pattern matching"
      },
      {
        name: "Overlapping Phase A and Phase B",
        input: "在那些魔帅眼中",
        description: "Tests pattern competition: '在XY中' vs '在X眼中'"
      },
      {
        name: "Multiple Phase A patterns",
        input: "这些强大的武技",
        description: "Multiple allowAsPatternVariable patterns"
      },
      {
        name: "Hierarchical composition",
        input: "这些强大的武技中",
        description: "Phase A result absorbed into Phase B pattern"
      },
      {
        name: "No pattern match (character fallback)",
        input: "测试文本",
        description: "No patterns should match, tests empty result handling"
      },
      {
        name: "Multi-variable pattern (XY)",
        input: "在这可怕的声波振荡之中",
        description: "Pattern with multiple variables: '在X中' + other patterns"
      },
      {
        name: "Low priority pattern",
        input: "在强大力量中",
        description: "Tests lowPriority flag effect on pattern selection"
      },
      {
        name: "Identical position match",
        input: "从上面",
        description: "Tests duplicate position filtering in hierarchical composition"
      }
    ];

    let wasmEnabled = true;

    window.toggleWasm = function() {
      wasmEnabled = !wasmEnabled;
      document.getElementById('wasm-status').textContent = wasmEnabled ? 'Enabled' : 'Disabled';
    };

    window.runTests = async function() {
      const resultsDiv = document.getElementById('results');
      const summaryDiv = document.getElementById('summary');
      resultsDiv.innerHTML = '<p>Running tests...</p>';
      summaryDiv.innerHTML = '';

      let passCount = 0;
      let failCount = 0;
      const results = [];

      for (const testCase of TEST_CASES) {
        try {
          const result = await runSingleTest(testCase);
          results.push(result);
          if (result.pass) {
            passCount++;
          } else {
            failCount++;
          }
        } catch (error) {
          results.push({
            name: testCase.name,
            pass: false,
            error: error.message
          });
          failCount++;
        }
      }

      // Display results
      resultsDiv.innerHTML = results.map(result => renderTestResult(result)).join('');

      // Display summary
      const totalTests = TEST_CASES.length;
      summaryDiv.className = failCount === 0 ? 'pass' : 'fail';
      summaryDiv.innerHTML = `
        <div>Test Summary: ${passCount}/${totalTests} passed</div>
        ${failCount > 0 ? `<div>⚠️ ${failCount} test(s) failed - implementations differ!</div>` : '<div>✅ All tests passed - implementations are equivalent!</div>'}
      `;
    };

    async function runSingleTest(testCase) {
      // This is a simplified test - in reality, we'd need to:
      // 1. Load patterns from actual dictionary
      // 2. Tokenize the input
      // 3. Run through both processors
      // 4. Compare results

      // For now, we'll just verify WASM is working
      const wasmAvailable = isWasmPatternProcessorAvailable();

      return {
        name: testCase.name,
        description: testCase.description,
        input: testCase.input,
        pass: wasmAvailable === wasmEnabled,
        wasmAvailable,
        wasmEnabled,
        note: "Simplified test - full implementation requires integration with TranslationEngine"
      };
    }

    function renderTestResult(result) {
      const statusClass = result.pass ? 'pass' : 'fail';
      const statusIcon = result.pass ? '✅' : '❌';

      return `
        <div class="test-case ${statusClass}">
          <div class="test-header">${statusIcon} ${result.name}</div>
          <div class="test-details">
            <div><strong>Description:</strong> ${result.description}</div>
            <div><strong>Input:</strong> "${result.input}"</div>
            ${result.error ? `<div class="diff"><strong>Error:</strong> ${result.error}</div>` : ''}
            ${result.note ? `<div><strong>Note:</strong> ${result.note}</div>` : ''}
          </div>
        </div>
      `;
    }

    // Auto-run tests on page load
    window.addEventListener('load', () => {
      console.log('🧪 Pattern Parity Test Page Loaded');
      console.log('Click "Run Parity Tests" to verify Rust and JavaScript implementations');
    });
  </script>
</body>
</html>
