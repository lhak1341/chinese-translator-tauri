[package]
name = "translation-wasm-core"
version = "0.2.0"
edition = "2021"
description = "WASM core module for Chinese-Vietnamese translation acceleration"
repository = "https://github.com/lhak1341/chinese-translator-tauri"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
regex = "1.11"             # For pattern processing
unicode-properties = "0.1"    # For Unicode General Category detection
lazy_static = "1.5"        # For static regex compilation

# wasm32 only: web-sys calls into JS through `#[rustc_nounwind]` FFI, so a call that reaches a
# native `cargo test` aborts the whole test process. Without the crate on native targets, a call
# not gated by `#[cfg(target_arch = "wasm32")]` fails to compile there instead.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance",
  "PerformanceEntry",
  "PerformanceMeasure",
  "Window",
  "WorkerGlobalScope",
  "DedicatedWorkerGlobalScope"
]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pattern_matching"
harness = false

[[bench]]
name = "real_dictionary_profile"
harness = false

[profile.release]
# Optimize for size and speed
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Optimize for WASM specifically
[profile.release.package."*"]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
# Additional WASM optimizations