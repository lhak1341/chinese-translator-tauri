[package]
name = "translation-wasm-core"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3"
console_error_panic_hook = "0.1"
regex = "1.11"             # For pattern processing
unicode-segmentation = "1.12" # For Chinese text tokenization
fxhash = "0.2.1"           # Faster hash maps
lazy_static = "1.5"        # For static regex compilation

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance",
  "PerformanceEntry",
  "PerformanceMeasure",
  "Window",
  "WorkerGlobalScope",
  "DedicatedWorkerGlobalScope"
]

[profile.release]
# Optimize for size and speed
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Optimize for WASM specifically
[profile.release.package."*"]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
# Additional WASM optimizations