[package]
name = "translation-wasm-core"
version = "0.2.0"
edition = "2021"
description = "WASM core module for Chinese-Vietnamese translation acceleration"
repository = "https://github.com/lhak1341/chinese-translator-tauri"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3"
console_error_panic_hook = "0.1"
regex = "1.11"             # For pattern processing
unicode-normalization = "0.1" # For NFC text normalization
unicode-properties = "0.1"    # For Unicode General Category detection
lazy_static = "1.5"        # For static regex compilation
bincode = "1.3"            # Binary serialization for WASM boundary
web-time = "1.1"           # For WASM-compatible time measurements

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance",
  "PerformanceEntry",
  "PerformanceMeasure",
  "Window",
  "WorkerGlobalScope",
  "DedicatedWorkerGlobalScope"
]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pattern_matching"
harness = false

[profile.release]
# Optimize for size and speed
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Optimize for WASM specifically
[profile.release.package."*"]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
# Additional WASM optimizations